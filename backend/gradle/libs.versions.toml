[versions]
spring-boot = "4.1.1"
spring-modulith = "2.1.1"
springdoc = "3.1.0"
springdoc-plugin = "1.9.0"
testcontainers = "1.21.4"
meilisearch = "0.20.1"
minio = "9.0.4"
okhttp = "4.12.0"
jsoup = "1.23.2"
flexmark = "0.64.8"
archunit = "1.5.0"
bouncycastle = "1.83"
mybatis-spring = "4.1.0"
java-diff-utils = "4.17"
json-schema-validator = "3.0.7"
bucket4j = "8.19.0"
checkstyle = "14.1.0"
palantirJavaFormat = "2.98.0"
spotless = "8.10.2"
dependency-analysis = "3.19.1"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-modulith-bom = { module = "org.springframework.modulith:spring-modulith-bom", version.ref = "spring-modulith" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
meilisearch = { module = "com.meilisearch.sdk:meilisearch-java", version.ref = "meilisearch" }
minio = { module = "io.minio:minio", version.ref = "minio" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
flexmark = { module = "com.vladsch.flexmark:flexmark-all", version.ref = "flexmark" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
mybatis-spring-boot = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter", version.ref = "mybatis-spring" }
java-diff-utils = { module = "io.github.java-diff-utils:java-diff-utils", version.ref = "java-diff-utils" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
bucket4j = { module = "com.bucket4j:bucket4j_jdk17-core", version.ref = "bucket4j" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
springdoc = { id = "org.springdoc.openapi-gradle-plugin", version.ref = "springdoc-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
